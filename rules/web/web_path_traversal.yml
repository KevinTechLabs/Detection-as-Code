title: Path Traversal Attempt in Web Request
id: 07c856ed-4698-4af2-b037-6afac505701c
status: experimental
description: |
  Detects directory traversal sequences in request URIs, including URL-encoded
  variants, targeting sensitive files such as /etc/passwd.
references:
  - https://attack.mitre.org/techniques/T1190/
author: Kevin Marcotte
date: 2026-10-19
tags:
  - attack.initial-access
  - attack.t1190
logsource:
  category: webserver
detection:
  selection_traversal:
    cs-uri-query|contains:
      - '../'
      - '..%2f'
      - '%2e%2e/'
      - '%2e%2e%2f'
  selection_target:
    cs-uri-query|contains:
      - 'etc/passwd'
      - 'etc/shadow'
      - 'win.ini'
      - '.ssh/'
  condition: all of selection_*
falsepositives:
  - Vulnerability scanners you run yourself (tag their source IP)
level: high
