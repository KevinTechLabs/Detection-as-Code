title: Credential File Search With find or grep
id: 17776236-5663-4f7f-a89c-e83801c23056
status: experimental
description: |
  Detects find or grep run with arguments that look like a hunt for credential
  material (cloud keys, SSH keys, password stores, tokens).
  Derived from Homelab-Threat-Hunt H7: the original Wazuh rule fired on every
  find/grep and was right 1 time in 109. Matching on the arguments keeps the one
  real hit (an Atomic test searching for .aws/credentials) and drops the cron
  jobs, desktop-entry lookups and short pipelines.
references:
  - https://github.com/KevinTechLabs/Homelab-Threat-Hunt/blob/main/docs/hunt-log.md
  - https://attack.mitre.org/techniques/T1552/001/
author: Kevin Marcotte
date: 2026-10-20
tags:
  - attack.credential-access
  - attack.t1552.001
logsource:
  product: linux
  category: process_creation
detection:
  selection_tool:
    Image|endswith:
      - '/find'
      - '/grep'
      - '/egrep'
      - '/rg'
  selection_args:
    CommandLine|contains:
      - 'cred'
      - 'passw'
      - '.aws'
      - 'id_rsa'
      - 'id_ed25519'
      - '.ssh/'
      - 'shadow'
      - 'token'
      - 'secret'
      - '.pem'
      - '.kdbx'
  condition: all of selection_*
falsepositives:
  - An administrator searching their own config for a setting named "token" or "secret"
level: medium
